[workspace]
resolver = "3"
members = [
    "crates/cjson-core",
    "crates/cjson-ffi",
]

[workspace.package]
version = "1.7.19"
edition = "2024"
license = "MIT"
repository = "https://github.com/terrarich2004/cjson-rs"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
